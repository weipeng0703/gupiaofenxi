services:
  - type: web
    name: gupiaofenxi-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1